<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#333"/></marker>
  </defs>
  <rect width="760" height="220" fill="#fff"/>
  <rect x="20" y="70" width="150" height="70" rx="8" fill="#e8f1fb" stroke="#1f77b4"/>
  <text x="95" y="100" text-anchor="middle" font-weight="bold">Prepare</text>
  <text x="95" y="120" text-anchor="middle">|0⟩ (reset)</text>
  <rect x="230" y="70" width="170" height="70" rx="8" fill="#eaf7ea" stroke="#2ca02c"/>
  <text x="315" y="100" text-anchor="middle" font-weight="bold">Evolve (unitary)</text>
  <text x="315" y="120" text-anchor="middle">|ψ⟩ = U|0⟩ — reversible</text>
  <rect x="460" y="70" width="140" height="70" rx="8" fill="#fdeaea" stroke="#d62728"/>
  <text x="530" y="100" text-anchor="middle" font-weight="bold">Measure</text>
  <text x="530" y="120" text-anchor="middle">irreversible, Born rule</text>
  <rect x="650" y="40" width="90" height="50" rx="8" fill="#fff" stroke="#333"/>
  <text x="695" y="70" text-anchor="middle">0  p=|α|²</text>
  <rect x="650" y="120" width="90" height="50" rx="8" fill="#fff" stroke="#333"/>
  <text x="695" y="150" text-anchor="middle">1  p=|β|²</text>
  <line x1="170" y1="105" x2="228" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="105" x2="458" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="95" x2="648" y2="68" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="115" x2="648" y2="142" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="200" text-anchor="middle" fill="#555" font-size="12">Repeat the whole pipeline many "shots" to estimate probabilities.</text>
</svg>
